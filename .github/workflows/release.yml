name: Release

# 触发方式:
#   1. 推送 tag(如 v0.1.0)→ 自动构建五平台并发布到 GitHub Release
#   2. 手动 workflow_dispatch → 仅构建并上传 Artifacts
on:
  workflow_dispatch:
  push:
    tags: [ "v*" ]

env:
  PROJECT: AetherVMStudio.CS/AetherVMStudio.csproj
  APP_NAME: AetherVMStudio

permissions:
  contents: write   # 允许创建 Release

jobs:
  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 / arm64
          - { rid: win-x64,     os: windows-latest, ext: zip }
          - { rid: win-arm64,   os: windows-latest, ext: zip }
          # macOS Intel / Apple Silicon
          - { rid: osx-x64,     os: macos-latest,   ext: zip }
          - { rid: osx-arm64,   os: macos-latest,   ext: zip }
          # Linux x64 / arm64
          - { rid: linux-x64,   os: ubuntu-latest,  ext: tar.gz }
          - { rid: linux-arm64, os: ubuntu-latest,  ext: tar.gz }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained single-file)
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Package (Windows / macOS → zip)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $dest = "${{ env.APP_NAME }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/* -DestinationPath $dest
          echo "PACKAGE=$dest" >> $env:GITHUB_ENV

      - name: Package (Linux → tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          chmod +x publish/${{ env.APP_NAME }} || true
          dest="${{ env.APP_NAME }}-${{ matrix.rid }}.tar.gz"
          tar -czf "$dest" -C publish .
          echo "PACKAGE=$dest" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: ${{ env.APP_NAME }}-${{ matrix.rid }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create Release and upload
        uses: softprops/action-gh-release@v2
        with:
          name: AetherVM Studio ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*

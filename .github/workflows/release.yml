name: Release

# 瑙﹀彂鏂瑰紡:
#   1. 鎺ㄩ€?tag(濡?v0.1.0)鈫?鑷姩鏋勫缓鍏钩鍙板苟鍙戝竷鍒?GitHub Release
#   2. 鎵嬪姩 workflow_dispatch 鈫?鍙€夊紑鍏?
#        use_aot       浣跨敤 NativeAOT 鍙戝竷(榛樿鍏抽棴;TCYM.UI 璧板弽灏?濡傞亣涓嶅吋瀹硅鐢ㄦ櫘閫氬彂甯?
#        bundle_engine 鍚屾椂缂栬瘧 AetherVM C++ 妗ユ帴搴撳苟鎵撳寘杩涘簲鐢?榛樿寮€鍚?澶辫触鑷姩鍥為€€ DemoEngine)
on:
  workflow_dispatch:
    inputs:
      use_aot:
        description: "浣跨敤 NativeAOT 鍙戝竷(瀹為獙鎬?"
        type: boolean
        default: false
      bundle_engine:
        description: "缂栬瘧骞舵墦鍖?AetherVM C++ 寮曟搸妗ユ帴搴?
        type: boolean
        default: true
  push:
    tags: [ "v*" ]

env:
  PROJECT: AetherVMStudio.CS/AetherVMStudio.csproj
  APP_NAME: AetherVMStudio

permissions:
  contents: write

jobs:
  # ============ AetherVM C++ 妗ユ帴搴撴瀯寤?============
  # AetherVM 浠ュ瓙妯″潡(v0.2.0)閿佸畾;鐢ㄥ畼鏂?icpp 棰勭紪璇戝寘鑷妇鏋勫缓寮曟搸,
  # 鍐嶇紪璇?native/AetherVMBridge.cpp 寰楀埌 aevm_bridge 鍔ㄦ€佸簱銆?  # 浠讳綍涓€姝ュけ璐ラ兘涓嶉樆濉炲彂甯?搴旂敤鑷姩鍥為€€鍒板唴缃?DemoEngine)銆?  engine:
    name: Build AetherVM bridge (${{ matrix.artifact }})
    if: ${{ github.event_name == 'push' || github.event.inputs.bundle_engine == 'true' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,      artifact: aevm_bridge-win-x64,     icpp: icpp-v0.4.0-windows-x86_64.tar.gz }
          - { os: macos-latest,        artifact: aevm_bridge-osx-arm64,   icpp: icpp-v0.4.0-macos-arm64.tar.gz }
          - { os: ubuntu-latest,       artifact: aevm_bridge-linux-x64,   icpp: icpp-v0.4.0-linux-x86_64.tar.gz }
          - { os: ubuntu-24.04-arm,    artifact: aevm_bridge-linux-arm64, icpp: icpp-v0.4.0-linux-aarch64.tar.gz }
    steps:
      - name: Checkout (with AetherVM v0.2.0 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # icpp 棰勭紪璇戝寘鍐呭惈 v0.2.0 鐨?AetherVM 澶存枃浠?include/aevm)涓庡姩鎬佸簱(bin|lib),
      # 鏃犻渶浠庢簮鐮佹瀯寤哄紩鎿?妗ユ帴灞傜洿鎺ュ AetherVM 鍔ㄦ€佸簱閾炬帴銆?      - name: Download icpp package (with AetherVM runtime)
        shell: bash
        run: |
          mkdir -p aethervm
          curl -L --fail --retry 3 -o aethervm/icpp.tar.gz \
            "https://github.com/vpand/icpp/releases/download/v0.4.0/${{ matrix.icpp }}"
          tar -xzf aethervm/icpp.tar.gz -C aethervm
          # 浠?include/aevm/AetherVM.h 瀹氫綅鍖呮牴鐩綍(鍚勫钩鍙板寘甯冨眬涓€鑷?
          hdr="$(find aethervm -type f -name AetherVM.h -path '*aevm*' | head -1)"
          [ -z "$hdr" ] && { echo "::error::瑙ｅ寘鍚庢湭鎵惧埌 include/aevm/AetherVM.h"; tar -tzf aethervm/icpp.tar.gz | head -10; exit 1; }
          echo "AETHERVM_ROOT=$(cd "$(dirname "$hdr")/../.." && (pwd -W 2>/dev/null || pwd))" >> $GITHUB_ENV
          ls "$(cd "$(dirname "$hdr")/../.." && pwd)"

      - name: Locate MSVC tools and generate AetherVM.lib (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64' | Select-Object -First 1
          & native/genwinlib.ps1 -Dll "aethervm/icpp-v0.4.0-windows-x86_64/bin/AetherVM.dll" `
            -Dumpbin "$dir\dumpbin.exe" -Lib "$dir\lib.exe" -Out "native/prebuilt/AetherVM.lib"
          & native/genwinlib.ps1 -Dll "aethervm/icpp-v0.4.0-windows-x86_64/bin/AetherBinary.dll" `
            -Dumpbin "$dir\dumpbin.exe" -Lib "$dir\lib.exe" -Out "native/prebuilt/AetherBinary.lib"
          "AETHERVM_IMPLIB=$(Resolve-Path native/prebuilt/AetherVM.lib)" >> $env:GITHUB_ENV

      # Windows 蹇呴』鐢?icpp 鑷甫鐨?clang(libc++ ABI 涓?AetherVM.dll 鍖归厤),涓嶈兘鐢?MSVC STL
      - name: Build bridge library (Windows, icpp clang++)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & "$env:AETHERVM_ROOT/bin/clang++.exe" -std=c++20 -shared -o out/aevm_bridge.dll `
            native/AetherVMBridge.cpp `
            -I "$env:AETHERVM_ROOT/include" -I "$env:AETHERVM_ROOT/include/aebi" `
            -nostdinc++ -isystem "$env:AETHERVM_ROOT/include/c++/v1" `
            native/prebuilt/AetherVM.lib native/prebuilt/AetherBinary.lib "$env:AETHERVM_ROOT/lib/c++.lib" `
            -Wno-everything
          if ($LASTEXITCODE -ne 0) { throw "clang++ build failed" }

      - name: Build bridge library (macOS/Linux, cmake)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          args=(-DAETHERVM_ROOT="$AETHERVM_ROOT" -DCMAKE_BUILD_TYPE=Release)
          cmake -S native -B native/build "${args[@]}"
          cmake --build native/build --config Release
          mkdir -p out
          find native/build -type f -name "libaevm_bridge.*" -exec cp {} out/ \;

      - name: Collect library + AetherVM runtime
        shell: bash
        run: |
          mkdir -p out
          find native/build -type f \( -name "libaevm_bridge.*" \) -exec cp {} out/ \; 2>/dev/null || true
          # AetherVM 杩愯搴撱€佷緷璧栦笌璇箟 bitcode 涓€骞舵墦鍖?搴旂敤鎸夐渶鍔犺浇)
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$AETHERVM_ROOT"/bin/AetherVM.dll "$AETHERVM_ROOT"/bin/AetherBinary.dll out/
            cp -r "$AETHERVM_ROOT"/bin/bitcode out/bitcode
          else
            cp "$AETHERVM_ROOT"/lib/libAetherVM.* "$AETHERVM_ROOT"/lib/libAetherBinary.* out/ 2>/dev/null || true
            find "$AETHERVM_ROOT" -type d -name bitcode -exec cp -r {}/. out/bitcode \; 2>/dev/null || true
          fi
          ls -la out/

      - name: Upload bridge library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: ignore
          retention-days: 1

  # ============ 搴旂敤鏋勫缓 ============
  build:
    name: Build ${{ matrix.rid }}
    needs: [engine]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, ext: zip }
          - { rid: win-arm64,   os: windows-latest, ext: zip }
          - { rid: osx-x64,     os: macos-latest,   ext: zip, app-bundle: true }
          - { rid: osx-arm64,   os: macos-latest,   ext: zip, app-bundle: true }
          - { rid: linux-x64,   os: ubuntu-latest,  ext: tar.gz }
          - { rid: linux-arm64, os: ubuntu-latest,  ext: tar.gz }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine publish flags
        id: flags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.use_aot }}" = "true" ]; then
            echo "aot=true" >> $GITHUB_OUTPUT
            echo "::warning::NativeAOT 涓哄疄楠屾€?TCYM.UI/SkiaSharp 鑻ヤ笉鍏煎璇锋敼鐢ㄦ櫘閫氬彂甯?
          else
            echo "aot=false" >> $GITHUB_OUTPUT
          fi

      # 寮曠敤鐨?TCYM.UI / SDL3 / SkiaSharp 鍏ㄩ儴鍐呭祵;AOT 鏃剁鐢ㄥ崟鏂囦欢鑷В鍘?AOT 鏈韩灏辨槸鍘熺敓浜岃繘鍒?
      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          ${{ steps.flags.outputs.aot == 'true' && '-p:PublishAot=true' || '-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true' }}
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      # 鎶婂紩鎿庢ˉ鎺ュ簱骞跺叆鍖?鏈夊垯甯︿笂,娌℃湁鍒欏簲鐢ㄥ洖閫€ DemoEngine)
      - name: Try download AetherVM bridge library
        if: ${{ needs.engine.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: aevm_bridge-*
          merge-multiple: true
          path: engine_lib
        continue-on-error: true

      - name: Merge engine library into publish output
        shell: bash
        run: |
          if [ -d engine_lib ] && [ -n "$(ls engine_lib 2>/dev/null)" ]; then
            mkdir -p engine_pick
            if [ "$RUNNER_OS" = "Windows" ]; then
              find engine_lib -maxdepth 1 -type f \( -name "aevm_bridge.dll" -o -name "AetherVM.dll" -o -name "AetherBinary.dll" \) -exec cp {} engine_pick/ \;
            else
              find engine_lib -maxdepth 1 -type f \( -name "libaevm_bridge.*" -o -name "libAetherVM.*" -o -name "libAetherBinary.*" \) -exec cp {} engine_pick/ \;
            fi
            [ -d engine_lib/bitcode ] && cp -r engine_lib/bitcode engine_pick/bitcode
            cp -r engine_pick/. publish/
            echo "AetherVM bridge bundled"
          else
            echo "::notice::鏃犲紩鎿庡簱,鏈寘浣跨敤鍐呯疆 DemoEngine"
          fi

      - name: Show publish output
        shell: bash
        run: ls -la publish/

      # ---------- Windows ----------
      - name: Package (Windows)
        if: matrix.ext == 'zip' && matrix.app-bundle != true
        shell: pwsh
        run: |
          $dir = "${{ env.APP_NAME }}-${{ matrix.rid }}"
          Copy-Item publish "$dir" -Recurse
          Copy-Item AetherVMStudio.CS/README.md "$dir/浣跨敤璇存槑.md"
          Compress-Archive -Path "$dir" -DestinationPath "$dir.zip"
          echo "PACKAGE=$dir.zip" >> $env:GITHUB_ENV

      # ---------- macOS .app ----------
      - name: Package (macOS .app bundle)
        if: matrix.app-bundle == true
        shell: bash
        run: |
          APP="${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp publish/${{ env.APP_NAME }} "$APP/Contents/MacOS/${{ env.APP_NAME }}"
          # 寮曟搸搴撲笌 AetherVM 杩愯搴撲竴骞舵斁杩?.app
          if [ -d engine_lib ]; then
            cp -v engine_lib/lib*.dylib "$APP/Contents/MacOS/" 2>/dev/null || true
            cp -r engine_lib/bitcode "$APP/Contents/MacOS/bitcode" 2>/dev/null || true
          fi
          chmod +x "$APP/Contents/MacOS/"*
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>            <string>AetherVM Studio</string>
            <key>CFBundleDisplayName</key>     <string>AetherVM Studio</string>
            <key>CFBundleIdentifier</key>      <string>com.byboy.aethervmstudio</string>
            <key>CFBundleExecutable</key>      <string>AetherVMStudio</string>
            <key>CFBundlePackageType</key>     <string>APPL</string>
            <key>CFBundleShortVersionString</key> <string>${{ github.ref_name }}</string>
            <key>CFBundleVersion</key>         <string>${{ github.ref_name }}</string>
            <key>NSHighResolutionCapable</key> <true/>
            <key>LSMinimumSystemVersion</key>  <string>11.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$APP/浣跨敤璇存槑.txt" <<'README'
          AetherVM Studio (macOS)

          棣栨杩愯:鍦?Finder 涓弻鍑?AetherVMStudio.app銆?          鑻ユ彁绀?鏃犳硶楠岃瘉寮€鍙戣€?,璇峰湪缁堢鎵ц:
            xattr -cr /path/to/AetherVMStudio.app
          鐒跺悗鍐嶆鍙屽嚮鍗冲彲銆傛湰鍖呬负鑷寘鍚?鏃犻渶瀹夎 .NET銆?          README
          dest="${{ env.APP_NAME }}-${{ matrix.rid }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$dest"
          echo "PACKAGE=$dest" >> $GITHUB_ENV

      # ---------- Linux ----------
      - name: Package (Linux)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          dir="${{ env.APP_NAME }}-${{ matrix.rid }}"
          mkdir -p "$dir"
          cp publish/${{ env.APP_NAME }} "$dir/"
          if [ -d engine_lib ]; then
            cp -v engine_lib/lib*.dylib "$dir/" 2>/dev/null || true
            cp -r engine_lib/bitcode "$dir/bitcode" 2>/dev/null || true
          fi
          chmod +x "$dir/${{ env.APP_NAME }}"
          cp AetherVMStudio.CS/README.md "$dir/浣跨敤璇存槑.md"
          cat > "$dir/鍚姩.sh" <<'SH'
          #!/bin/bash
          cd "$(dirname "$0")"
          # Ubuntu 22+/Debian 缂?SDL 杩愯搴撴椂:
          #   sudo apt install -y libsdl3-0 libxcb-cursor0
          ./AetherVMStudio
          SH
          chmod +x "$dir/鍚姩.sh"
          tar -czf "${{ env.APP_NAME }}-${{ matrix.rid }}.tar.gz" "$dir"
          echo "PACKAGE=${{ env.APP_NAME }}-${{ matrix.rid }}.tar.gz" >> $GITHUB_ENV

      # tag 鏋勫缓:鐩存帴涓婁紶鍒?GitHub Release(涓嶇粡杩?artifacts,閬垮厤瀛樺偍閰嶉闄愬埗)
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "AetherVM Studio $tag" --generate-notes || true
          for i in $(seq 1 10); do
            gh release upload "$tag" "$PACKAGE" --clobber --repo "$GITHUB_REPOSITORY" && break
            echo "retry $i..."; sleep 30
          done

      # 鎵嬪姩瑙﹀彂:璧?artifacts(1 澶╀繚鐣?
      - name: Upload artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 1
          retention-days: 1

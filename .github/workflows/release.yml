name: Release

# 触发方式:
#   1. 推送 tag(如 v0.1.0)→ 自动构建六平台并发布到 GitHub Release
#   2. 手动 workflow_dispatch → 可选开关:
#        use_aot       使用 NativeAOT 发布(默认关闭;TCYM.UI 走反射,如遇不兼容请用普通发布)
#        bundle_engine 同时编译 AetherVM C++ 桥接库并打包进应用(默认开启;失败自动回退 DemoEngine)
on:
  workflow_dispatch:
    inputs:
      use_aot:
        description: "使用 NativeAOT 发布(实验性)"
        type: boolean
        default: false
      bundle_engine:
        description: "编译并打包 AetherVM C++ 引擎桥接库"
        type: boolean
        default: true
  push:
    tags: [ "v*" ]

env:
  PROJECT: AetherVMStudio.CS/AetherVMStudio.csproj
  APP_NAME: AetherVMStudio

permissions:
  contents: write

jobs:
  # ============ AetherVM C++ 桥接库构建 ============
  # 下载 AetherVM 官方预编译包(v0.1.0),再编译 native/AetherVMBridge.cpp 得到
  # aevm_bridge.dll / libaevm_bridge.dylib / libaevm_bridge.so。
  # 任何一步失败都不阻塞发布(应用自动回退到内置 DemoEngine)。
  engine:
    name: Build AetherVM bridge (${{ matrix.artifact }})
    if: ${{ github.event_name == 'push' || github.event.inputs.bundle_engine == 'true' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, artifact: aevm_bridge-win-x64,      pkg: AetherVM-v0.1.0-windows-x86_64.tar.gz }
          - { os: macos-latest,   artifact: aevm_bridge-osx-arm64,    pkg: AetherVM-v0.1.0-macos-arm64.tar.gz }
          - { os: ubuntu-latest,  artifact: aevm_bridge-linux-x64,    pkg: AetherVM-v0.1.0-linux-x86_64.tar.gz }
          - { os: ubuntu-latest,  artifact: aevm_bridge-linux-arm64,  pkg: AetherVM-v0.1.0-linux-aarch64.tar.gz }
    steps:
      - name: Checkout (with AetherVM submodule headers)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 从源码构建 AetherVM 需要 icpp 自举链,过于复杂;
      # 这里使用官方预编译包(https://github.com/AetherVM/AetherVM/releases)
      - name: Download prebuilt AetherVM package
        shell: bash
        run: |
          mkdir -p aethervm && cd aethervm
          curl -L --fail --retry 3 -o pkg.tar.gz \
            "https://github.com/AetherVM/AetherVM/releases/download/v0.1.0/${{ matrix.pkg }}"
          tar -xzf pkg.tar.gz
          echo "AETHERVM_ROOT=$(pwd)/$(find . -maxdepth 2 -type d -name install | head -1 | sed 's|^\./||')" >> $GITHUB_ENV
          find . -maxdepth 3 | head -30

      - name: Build bridge library
        shell: bash
        run: |
          echo "Using AETHERVM_ROOT=$AETHERVM_ROOT"
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DAETHERVM_ROOT="$AETHERVM_ROOT"
          cmake --build native/build --config Release

      - name: Collect library
        shell: bash
        run: |
          mkdir -p out
          find native/build -type f \( -name "aevm_bridge.dll" -o -name "libaevm_bridge.dylib" -o -name "libaevm_bridge.so" \) -exec cp {} out/ \;
          ls -la out/

      - name: Upload bridge library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: ignore

  # ============ 应用构建 ============
  build:
    name: Build ${{ matrix.rid }}
    needs: [engine]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, ext: zip }
          - { rid: win-arm64,   os: windows-latest, ext: zip }
          - { rid: osx-x64,     os: macos-latest,   ext: zip, app-bundle: true }
          - { rid: osx-arm64,   os: macos-latest,   ext: zip, app-bundle: true }
          - { rid: linux-x64,   os: ubuntu-latest,  ext: tar.gz }
          - { rid: linux-arm64, os: ubuntu-latest,  ext: tar.gz }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine publish flags
        id: flags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.use_aot }}" = "true" ]; then
            echo "aot=true" >> $GITHUB_OUTPUT
            echo "::warning::NativeAOT 为实验性,TCYM.UI/SkiaSharp 若不兼容请改用普通发布"
          else
            echo "aot=false" >> $GITHUB_OUTPUT
          fi

      # 引用的 TCYM.UI / SDL3 / SkiaSharp 全部内嵌;AOT 时禁用单文件自解压(AOT 本身就是原生二进制)
      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          ${{ steps.flags.outputs.aot == 'true' && '-p:PublishAot=true' || '-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true' }}
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      # 把引擎桥接库并入包(有则带上,没有则应用回退 DemoEngine)
      - name: Try download AetherVM bridge library
        if: ${{ needs.engine.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: aevm_bridge-*
          merge-multiple: true
          path: engine_lib
        continue-on-error: true

      - name: Merge engine library into publish output
        shell: bash
        run: |
          if [ -d engine_lib ] && [ -n "$(ls engine_lib 2>/dev/null)" ]; then
            cp -v engine_lib/* publish/ 2>/dev/null || cp -v engine_lib/* publish/*.app/Contents/MacOS/ 2>/dev/null || true
            echo "AetherVM bridge bundled"
          else
            echo "::notice::无引擎库,本包使用内置 DemoEngine"
          fi

      - name: Show publish output
        shell: bash
        run: ls -la publish/

      # ---------- Windows ----------
      - name: Package (Windows)
        if: matrix.ext == 'zip' && matrix.app-bundle != true
        shell: pwsh
        run: |
          $dir = "${{ env.APP_NAME }}-${{ matrix.rid }}"
          Copy-Item publish "$dir" -Recurse
          Copy-Item AetherVMStudio.CS/README.md "$dir/使用说明.md"
          Compress-Archive -Path "$dir" -DestinationPath "$dir.zip"
          echo "PACKAGE=$dir.zip" >> $env:GITHUB_ENV

      # ---------- macOS .app ----------
      - name: Package (macOS .app bundle)
        if: matrix.app-bundle == true
        shell: bash
        run: |
          APP="${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp publish/${{ env.APP_NAME }} "$APP/Contents/MacOS/${{ env.APP_NAME }}"
          # 引擎库放进 .app(应用按自身目录探测 libaevm_bridge.dylib)
          if [ -d engine_lib ]; then cp -v engine_lib/libaevm_bridge* "$APP/Contents/MacOS/" 2>/dev/null || true; fi
          chmod +x "$APP/Contents/MacOS/"*
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>            <string>AetherVM Studio</string>
            <key>CFBundleDisplayName</key>     <string>AetherVM Studio</string>
            <key>CFBundleIdentifier</key>      <string>com.byboy.aethervmstudio</string>
            <key>CFBundleExecutable</key>      <string>AetherVMStudio</string>
            <key>CFBundlePackageType</key>     <string>APPL</string>
            <key>CFBundleShortVersionString</key> <string>${{ github.ref_name }}</string>
            <key>CFBundleVersion</key>         <string>${{ github.ref_name }}</string>
            <key>NSHighResolutionCapable</key> <true/>
            <key>LSMinimumSystemVersion</key>  <string>11.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$APP/使用说明.txt" <<'README'
          AetherVM Studio (macOS)

          首次运行:在 Finder 中双击 AetherVMStudio.app。
          若提示"无法验证开发者",请在终端执行:
            xattr -cr /path/to/AetherVMStudio.app
          然后再次双击即可。本包为自包含,无需安装 .NET。
          README
          dest="${{ env.APP_NAME }}-${{ matrix.rid }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$dest"
          echo "PACKAGE=$dest" >> $GITHUB_ENV

      # ---------- Linux ----------
      - name: Package (Linux)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          dir="${{ env.APP_NAME }}-${{ matrix.rid }}"
          mkdir -p "$dir"
          cp publish/${{ env.APP_NAME }} "$dir/"
          if [ -d engine_lib ]; then cp -v engine_lib/libaevm_bridge* "$dir/" 2>/dev/null || true; fi
          chmod +x "$dir/${{ env.APP_NAME }}"
          cp AetherVMStudio.CS/README.md "$dir/使用说明.md"
          cat > "$dir/启动.sh" <<'SH'
          #!/bin/bash
          cd "$(dirname "$0")"
          # Ubuntu 22+/Debian 缺 SDL 运行库时:
          #   sudo apt install -y libsdl3-0 libxcb-cursor0
          ./AetherVMStudio
          SH
          chmod +x "$dir/启动.sh"
          tar -czf "${{ env.APP_NAME }}-${{ matrix.rid }}.tar.gz" "$dir"
          echo "PACKAGE=${{ env.APP_NAME }}-${{ matrix.rid }}.tar.gz" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: AetherVMStudio-*
          merge-multiple: true
          path: dist

      - name: Create Release and upload
        uses: softprops/action-gh-release@v2
        with:
          name: AetherVM Studio ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 下载说明(开箱即用,无需安装 .NET)

            | 平台 | 文件 | 使用方式 |
            |---|---|---|
            | Windows x64 / ARM64 | `*-win-*.zip` | 解压后双击 `AetherVMStudio.exe` |
            | macOS (Apple Silicon) | `*-osx-arm64.zip` | 解压得到 `AetherVMStudio.app`,双击运行;若提示无法验证开发者,执行 `xattr -cr AetherVMStudio.app` |
            | macOS (Intel) | `*-osx-x64.zip` | 同上 |
            | Linux x64 / ARM64 | `*-linux-*.tar.gz` | 解压后 `./启动.sh`;缺 SDL 运行库时 `sudo apt install libsdl3-0` |

            - TCYM.UI / SDL3 / SkiaSharp native 依赖已全部内嵌进可执行文件
            - 包内若含 `aevm_bridge` 原生库则使用真实 AetherVM 引擎,否则自动回退内置 DemoEngine
          files: dist/*

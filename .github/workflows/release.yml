name: Release

# 触发方式:
#   1. 推送 tag(如 v0.2.0)→ 自动构建六平台并直接上传到 GitHub Release
#   2. 手动 workflow_dispatch → 可选开关:
#        use_aot       NativeAOT 发布(实验性)
#        bundle_engine 编译 AetherVM C++ 桥接库并打包(默认开启;失败自动回退 DemoEngine)
on:
  workflow_dispatch:
    inputs:
      use_aot:
        description: "使用 NativeAOT 发布(实验性)"
        type: boolean
        default: false
      bundle_engine:
        description: "编译并打包 AetherVM C++ 引擎桥接库"
        type: boolean
        default: true
  push:
    tags: [ "v*" ]

env:
  PROJECT: AetherVMStudio.CS/AetherVMStudio.csproj
  APP_NAME: AetherVMStudio

permissions:
  contents: write

jobs:
  # ============ AetherVM C++ 桥接库构建 ============
  # AetherVM 以子模块(v0.2.0)锁定;引擎运行库来自 icpp 官方预编译包;
  # 桥接层(native/AetherVMBridge.cpp)必须用 icpp 的 clang 编译以匹配 libc++ ABI。
  # 任何一步失败都不阻塞发布(应用自动回退到内置 DemoEngine)。
  engine:
    name: Build AetherVM bridge (${{ matrix.artifact }})
    if: ${{ github.event_name == 'push' || github.event.inputs.bundle_engine == 'true' }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest,   artifact: aevm_bridge-win-x64,      icpp: icpp-v0.4.0-windows-x86_64.tar.gz }
          - { os: macos-latest,     artifact: aevm_bridge-osx-arm64,    icpp: icpp-v0.4.0-macos-arm64.tar.gz }
          - { os: ubuntu-latest,    artifact: aevm_bridge-linux-x64,    icpp: icpp-v0.4.0-linux-x86_64.tar.gz }
          - { os: ubuntu-24.04-arm, artifact: aevm_bridge-linux-arm64,  icpp: icpp-v0.4.0-linux-aarch64.tar.gz }
    steps:
      - name: Checkout (with AetherVM v0.2.0 submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download icpp package (with AetherVM runtime)
        shell: bash
        run: |
          mkdir -p aethervm
          curl -L --fail --retry 3 -o aethervm/icpp.tar.gz \
            "https://github.com/vpand/icpp/releases/download/v0.4.0/${{ matrix.icpp }}"
          tar -xzf aethervm/icpp.tar.gz -C aethervm
          hdr="$(find aethervm -type f -name AetherVM.h -path '*aevm*' | head -1)"
          [ -z "$hdr" ] && { echo "::error::icpp 包中未找到 include/aevm/AetherVM.h"; tar -tzf aethervm/icpp.tar.gz | head -10; exit 1; }
          echo "AETHERVM_ROOT=$(cd "$(dirname "$hdr")/../.." && (pwd -W 2>/dev/null || pwd))" >> $GITHUB_ENV

      # Windows:AetherVM.dll / AetherBinary.dll 无导入库,用 dumpbin+lib 现场生成
      - name: Generate import libraries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dir = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -find 'VC/Tools/MSVC/**/bin/Hostx64/x64' | Select-Object -First 1
          native/genwinlib.ps1 -Dll "$env:AETHERVM_ROOT/bin/AetherVM.dll" `
            -Dumpbin "$dir/dumpbin.exe" -Lib "$dir/lib.exe" -Out "native/prebuilt/AetherVM.lib"
          native/genwinlib.ps1 -Dll "$env:AETHERVM_ROOT/bin/AetherBinary.dll" `
            -Dumpbin "$dir/dumpbin.exe" -Lib "$dir/lib.exe" -Out "native/prebuilt/AetherBinary.lib"

      - name: Build bridge library (Windows, icpp clang++)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          & "$env:AETHERVM_ROOT/bin/clang++.exe" -std=c++20 -shared -o out/aevm_bridge.dll `
            native/AetherVMBridge.cpp `
            -I "$env:AETHERVM_ROOT/include" -I "$env:AETHERVM_ROOT/include/aebi" `
            -nostdinc++ -isystem "$env:AETHERVM_ROOT/include/c++/v1" `
            native/prebuilt/AetherVM.lib native/prebuilt/AetherBinary.lib "$env:AETHERVM_ROOT/lib/c++.lib" `
            -Wno-everything
          if ($LASTEXITCODE -ne 0) { throw "clang++ build failed" }

      - name: Build bridge library (macOS/Linux, cmake)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release -DAETHERVM_ROOT="$AETHERVM_ROOT"
          cmake --build native/build --config Release
          mkdir -p out
          find native/build -type f -name "libaevm_bridge.*" -exec cp {} out/ \;

      - name: Collect library + AetherVM runtime
        shell: bash
        run: |
          mkdir -p out
          find native/build -type f -name "libaevm_bridge.*" -exec cp {} out/ \; 2>/dev/null || true
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "$AETHERVM_ROOT"/bin/AetherVM.dll "$AETHERVM_ROOT"/bin/AetherBinary.dll out/
            cp -r "$AETHERVM_ROOT"/bin/bitcode out/bitcode
          else
            cp "$AETHERVM_ROOT"/lib/libAetherVM.* "$AETHERVM_ROOT"/lib/libAetherBinary.* out/ 2>/dev/null || true
            find "$AETHERVM_ROOT" -type d -name bitcode -exec cp -r {}/. out/bitcode \; 2>/dev/null || true
          fi
          ls -la out/

      - name: Upload bridge library
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          if-no-files-found: ignore
          retention-days: 1

  # ============ 应用构建 ============
  build:
    name: Build ${{ matrix.rid }}
    needs: [engine]
    if: ${{ always() && !failure() && !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest, ext: zip }
          - { rid: win-arm64,   os: windows-latest, ext: zip }
          - { rid: osx-x64,     os: macos-latest,   ext: zip, app-bundle: true }
          - { rid: osx-arm64,   os: macos-latest,   ext: zip, app-bundle: true }
          - { rid: linux-x64,   os: ubuntu-latest,  ext: tar.gz }
          - { rid: linux-arm64, os: ubuntu-latest,  ext: tar.gz }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Determine publish flags
        id: flags
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.use_aot }}" = "true" ]; then
            echo "aot=true" >> $GITHUB_OUTPUT
            echo "::warning::NativeAOT 为实验性,TCYM.UI/SkiaSharp 若不兼容请改用普通发布"
          else
            echo "aot=false" >> $GITHUB_OUTPUT
          fi

      # 自包含单文件发布:TCYM.UI / SDL3 / SkiaSharp native 依赖全部内嵌
      - name: Publish
        run: >
          dotnet publish ${{ env.PROJECT }}
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          ${{ steps.flags.outputs.aot == 'true' && '-p:PublishAot=true' || '-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true' }}
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish

      # 把引擎桥接库并入包(有则带上,没有则应用回退 DemoEngine)
      - name: Try download AetherVM bridge library
        if: ${{ needs.engine.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          pattern: aevm_bridge-*
          merge-multiple: true
          path: engine_lib
        continue-on-error: true

      - name: Merge engine library into publish output
        shell: bash
        run: |
          if [ -d engine_lib ] && [ -n "$(ls engine_lib 2>/dev/null)" ]; then
            mkdir -p engine_pick
            if [ "$RUNNER_OS" = "Windows" ]; then
              find engine_lib -maxdepth 1 -type f \( -name "aevm_bridge.dll" -o -name "AetherVM.dll" -o -name "AetherBinary.dll" \) -exec cp {} engine_pick/ \;
            else
              find engine_lib -maxdepth 1 -type f \( -name "libaevm_bridge.*" -o -name "libAetherVM.*" -o -name "libAetherBinary.*" \) -exec cp {} engine_pick/ \;
            fi
            [ -d engine_lib/bitcode ] && cp -r engine_lib/bitcode engine_pick/bitcode
            cp -r engine_pick/. publish/
            echo "AetherVM bridge bundled"
          else
            echo "::notice::无引擎库,本包使用内置 DemoEngine"
          fi

      # ---------- Windows ----------
      - name: Package (Windows)
        if: matrix.ext == 'zip' && matrix.app-bundle != true
        shell: pwsh
        run: |
          $dir = "${{ env.APP_NAME }}-${{ matrix.rid }}"
          Copy-Item publish "$dir" -Recurse
          Copy-Item AetherVMStudio.CS/README.md "$dir/README.md"
          Compress-Archive -Path "$dir" -DestinationPath "$dir.zip"
          echo "PACKAGE=$dir.zip" >> $env:GITHUB_ENV

      # ---------- macOS .app ----------
      - name: Package (macOS .app bundle)
        if: matrix.app-bundle == true
        shell: bash
        run: |
          APP="${{ env.APP_NAME }}.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp publish/${{ env.APP_NAME }} "$APP/Contents/MacOS/${{ env.APP_NAME }}"
          if [ -d engine_lib ]; then
            cp -v engine_lib/lib*.dylib "$APP/Contents/MacOS/" 2>/dev/null || true
            cp -r engine_lib/bitcode "$APP/Contents/MacOS/bitcode" 2>/dev/null || true
          fi
          chmod +x "$APP/Contents/MacOS/"*
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>            <string>AetherVM Studio</string>
            <key>CFBundleDisplayName</key>     <string>AetherVM Studio</string>
            <key>CFBundleIdentifier</key>      <string>com.byboy.aethervmstudio</string>
            <key>CFBundleExecutable</key>      <string>AetherVMStudio</string>
            <key>CFBundlePackageType</key>     <string>APPL</string>
            <key>CFBundleShortVersionString</key> <string>${{ github.ref_name }}</string>
            <key>CFBundleVersion</key>         <string>${{ github.ref_name }}</string>
            <key>NSHighResolutionCapable</key> <true/>
            <key>LSMinimumSystemVersion</key>  <string>11.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$APP/README.txt" <<'README'
          AetherVM Studio (macOS)

          双击 AetherVMStudio.app 运行。
          若提示"无法验证开发者",请在终端执行:
            xattr -cr /path/to/AetherVMStudio.app
          然后再次双击即可。本包为自包含,无需安装 .NET。
          README
          dest="${{ env.APP_NAME }}-${{ matrix.rid }}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$dest"
          echo "PACKAGE=$dest" >> $GITHUB_ENV

      # ---------- Linux ----------
      - name: Package (Linux)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          dir="${{ env.APP_NAME }}-${{ matrix.rid }}"
          mkdir -p "$dir"
          cp publish/${{ env.APP_NAME }} "$dir/"
          if [ -d engine_lib ]; then
            cp -v engine_lib/lib*.so* "$dir/" 2>/dev/null || true
            cp -r engine_lib/bitcode "$dir/bitcode" 2>/dev/null || true
          fi
          chmod +x "$dir/${{ env.APP_NAME }}"
          cp AetherVMStudio.CS/README.md "$dir/README.md"
          cat > "$dir/start.sh" <<'SH'
          #!/bin/bash
          cd "$(dirname "$0")"
          # Ubuntu 22+/Debian 缺 SDL 运行库时:
          #   sudo apt install -y libsdl3-0 libxcb-cursor0
          ./AetherVMStudio
          SH
          chmod +x "$dir/start.sh"
          tar -czf "${{ env.APP_NAME }}-${{ matrix.rid }}.tar.gz" "$dir"
          echo "PACKAGE=${{ env.APP_NAME }}-${{ matrix.rid }}.tar.gz" >> $GITHUB_ENV

      # tag 构建:直接上传到 GitHub Release(不经过 artifacts,避免存储配额限制)
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "AetherVM Studio $tag" --generate-notes || true
          for i in $(seq 1 10); do
            gh release upload "$tag" "$PACKAGE" --clobber --repo "$GITHUB_REPOSITORY" && break
            echo "retry $i..."; sleep 30
          done

      # 手动触发:走 artifacts(1 天保留)
      - name: Upload artifact
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 1
